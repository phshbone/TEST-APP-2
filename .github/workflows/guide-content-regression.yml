name: Guide content regression

on:
  push:
    branches: [foundation-v3-repair]
  workflow_dispatch:

jobs:
  guide-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/mpw-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mpw-http.log
          exit 1
      - name: Run guide content regression
        run: |
          mkdir -p tests
          cat > tests/guide-content-regression.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');
          const BASE='http://127.0.0.1:4173/index.html';
          test.use({ viewport:{width:390,height:844}, hasTouch:true, isMobile:true });
          test.beforeEach(async ({page})=>{
            await page.goto(BASE);
            await page.evaluate(()=>{localStorage.clear();sessionStorage.clear();});
            await page.reload();
            await page.locator('[data-route="guide"]').click();
          });
          test('check-in starts with activation-card preload and uses official EV 4+4 language', async ({page})=>{
            const checkin=page.locator('[data-procedure="checkin"]');
            await expect(checkin.locator('.lesson-card').first()).toContainText('Confirm the activation card is preloaded');
            const preload=checkin.locator('[data-lesson-card="checkin:preload"]');
            await preload.locator('[data-open-lesson="checkin:preload"]').click();
            await expect(preload).toContainText('pending check-in screen');
            await expect(preload).toContainText('Authority Slip screen');
            const search=checkin.locator('[data-lesson-card="checkin:search"]');
            await search.locator('[data-open-lesson="checkin:search"]').click();
            await expect(search.locator('.official')).toContainText('4+4 search method');
            await expect(search).toContainText('DO NOT turn this into a request for ID');
          });
          test('lesson controls use plus and minus rather than carets', async ({page})=>{
            const toggle=page.locator('[data-open-lesson="checkin:search"]');
            const before=await toggle.locator('.chevron').evaluate(el=>getComputedStyle(el,'::after').content);
            expect(before).toContain('+');
            await toggle.click();
            const after=await toggle.locator('.chevron').evaluate(el=>getComputedStyle(el,'::after').content);
            expect(after).toContain('−');
          });
          test('midweek morning starts with explicit binder opening kit', async ({page})=>{
            const morning=page.locator('[data-procedure="morning"]');
            await morning.locator('.procedure-toggle').click();
            await expect(morning).toContainText('Gather the current numbered binder and opening materials');
            await expect(morning).toContainText('seal log');
            await expect(morning).toContainText('barrel key');
            await expect(morning).toContainText('small manila envelope');
            await expect(morning).toContainText('pen');
            await expect(morning).toContainText('scissors');
            await expect(morning).toContainText('carried-forward value on the seal log');
            await expect(morning).toContainText('daily black pencil pouch');
          });
          test('midweek shutdown uses small seal envelope, machine-first order, and full closing finish', async ({page})=>{
            const shutdown=page.locator('[data-procedure="shutdown"]');
            await expect(shutdown).toContainText('Midweek Nightly Shutdown');
            await shutdown.locator('.procedure-toggle').click();
            await expect(shutdown).toContainText('small manila envelope');
            await expect(shutdown).toContainText('Verify the voting machine public counter');
            await expect(shutdown).toContainText('Print the System Readiness Report');
            await expect(shutdown).toContainText('swipe the ePollbook app closed');
            await expect(shutdown).toContainText('Power the router down last');
            await expect(shutdown).toContainText('return it to the secured cage/storage area');
            const warning=shutdown.locator('.warning-box');
            const visualTitle=await warning.evaluate(el=>{
              const dom=el.querySelector('.shutdown-warning-title')?.textContent||'';
              const pseudo=getComputedStyle(el,'::before').content||'';
              return `${dom} ${pseudo}`;
            });
            expect(visualTitle).toContain('DO NOT SELECT CLOSE POLL');
            const reconciliationText=await warning.evaluate(el=>`${el.textContent} ${getComputedStyle(el,'::after').content||''}`);
            expect(reconciliationText).toContain('DO NOT shut down all ePollbooks until the Master Poll Worker has verified and reconciled the totals');
            await expect(shutdown).toContainText('select Logout');
          });
          test('shared check-in completion uses sleeve, yellow bag, and Process Next Voter wording', async ({page})=>{
            const complete=page.locator('[data-lesson-card="checkin:complete"]');
            await complete.locator('[data-open-lesson="checkin:complete"]').click();
            await expect(complete).toContainText('Activation Card Sleeve');
            await expect(complete).toContainText('Yellow Signed Authority Slip Bag');
            await expect(complete).toContainText('ePollbook returned to Process Next Voter');
            await expect(complete).not.toContainText('Station returned to Process Next Voter');
          });
          test('mode switch keeps the corresponding guide topic in view', async ({page})=>{
            const checkin=page.locator('[data-procedure="checkin"]');
            await checkin.scrollIntoViewIfNeeded();
            await page.evaluate(()=>document.querySelector('[data-procedure="checkin"]').scrollIntoView());
            await page.locator('.mode-button[data-mode="election"]').click();
            await expect(page.locator('[data-procedure="checkin"]')).toBeVisible();
            const delta=await page.locator('[data-procedure="checkin"]').evaluate(el=>Math.abs(el.getBoundingClientRect().top-document.querySelector('#mainContent').getBoundingClientRect().top));
            expect(delta).toBeLessThan(220);
          });
          test('mail-in, voter-not-found, provisional, reprint and spoil cleanup renders', async ({page})=>{
            const mailin=page.locator('[data-procedure="mailin"]');
            await expect(mailin).toContainText('authorized ballot drop box');
            await expect(mailin).toContainText('Morris County Board of Elections in Morristown');
            await expect(mailin).toContainText('DO NOT accept the completed mail-in ballot at the polling location');
            await expect(page.locator('[data-procedure="notfound"]')).toContainText('Master Poll Worker or Board of Elections');
            await expect(page.locator('[data-procedure="provisional"]')).toContainText('The poll worker places the sealed envelope in the orange provisional bag');
            await expect(page.locator('[data-procedure="reprint"]')).toContainText('missing, misprinted, or unprinted item');
            await expect(page.locator('[data-procedure="reprint"]')).toContainText('screen has already advanced');
            await expect(page.locator('[data-procedure="spoil"]')).toContainText('printed, uncast ballot');
            await expect(page.locator('[data-procedure="spoil"]')).toContainText('one clear vertical pen line');
          });
          EOF
          npx playwright test tests/guide-content-regression.spec.js --reporter=line
