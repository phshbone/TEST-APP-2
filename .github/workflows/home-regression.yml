name: Home page regression

on:
  push:
    branches: [foundation-v3-repair]
  workflow_dispatch:

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/mpw-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mpw-http.log
          exit 1
      - name: Run Home regression
        run: |
          mkdir -p tests
          cat > tests/home-regression.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');
          const BASE='http://127.0.0.1:4173/index.html';
          test.use({ viewport:{width:390,height:844}, hasTouch:true, isMobile:true });
          test.beforeEach(async ({page})=>{
            await page.goto(BASE);
            await page.evaluate(()=>{localStorage.clear();sessionStorage.clear();});
            await page.reload();
          });
          test('brand logo loads', async ({page})=>{
            const logo=page.locator('.brand-logo');
            await expect(logo).toBeVisible();
            await expect.poll(()=>logo.evaluate(img=>img.complete&&img.naturalWidth>0)).toBeTruthy();
          });
          test('Home uses Morris County official Early Voting range and next Election Day', async ({page})=>{
            const heading=page.locator('.page-heading').first();
            await expect(heading).toContainText('Early Voting');
            await expect(heading).toContainText('Oct 24, 2026');
            await expect(heading).toContainText('Nov 1, 2026');
            await page.locator('.mode-button[data-mode="election"]').click();
            const electionHeading=page.locator('.page-heading').first();
            await expect(electionHeading).toContainText('Election Day');
            await expect(electionHeading).toContainText('Sep 15, 2026');
          });
          test('Important Dates includes published Morris County special and general election data', async ({page})=>{
            await page.locator('#menuButton').click();
            await page.locator('#sideMenu [data-route="current"]').click();
            const main=page.locator('#mainContent');
            await expect(main).toContainText('Published Morris County Calendar');
            await expect(main).toContainText('Special School Election');
            await expect(main).toContainText('September 15, 2026');
            await expect(main).toContainText('General Election');
            await expect(main).toContainText('Oct 24, 2026');
            await expect(main).toContainText('Nov 1, 2026');
          });
          test('Today at a glance uses plus and minus cues', async ({page})=>{
            const toggle=page.locator('[data-home-glance-toggle]');
            const cue=toggle.locator('.home-glance-chevron');
            await expect(cue).toHaveText('+');
            await toggle.click();
            await expect(cue).toHaveText('−');
          });
          EOF
          npx playwright test tests/home-regression.spec.js --reporter=line
