name: Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional deployed URL; blank tests this commit through RawGitHack
        required: false
        type: string
  push:
    branches:
      - foundation-v3-repair

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployed target
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_url }}" ]; then
            echo "LIVE_SMOKE_URL=${{ github.event.inputs.target_url }}" >> "$GITHUB_ENV"
          else
            echo "LIVE_SMOKE_URL=https://raw.githack.com/phshbone/TEST-APP-2/${GITHUB_SHA}/index.html" >> "$GITHUB_ENV"
          fi

      - name: Wait for deployed target
        shell: bash
        run: |
          echo "Testing $LIVE_SMOKE_URL"
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --output /dev/null "$LIVE_SMOKE_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright test runner
        run: |
          npm init -y
          npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed live smoke test
        run: npx playwright test tests/live-smoke.spec.js tests/training-mode.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
