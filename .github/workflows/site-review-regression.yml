name: Site review regression

on:
  push:
    branches: [foundation-v3-repair, iphone-validation-2026-08-25]
  workflow_dispatch:

jobs:
  site-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev @playwright/test >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/mpw-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mpw-http.log
          exit 1
      - name: Run site review regression
        run: |
          mkdir -p tests
          cat > tests/site-review.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');
          const BASE='http://127.0.0.1:4173/index.html';
          test.use({ viewport:{width:390,height:844}, hasTouch:true, isMobile:true });
          test.beforeEach(async ({page})=>{
            await page.goto(BASE);
            await page.evaluate(()=>{localStorage.clear();sessionStorage.clear();});
            await page.reload();
          });

          test('bottom dock has five core routes and More holds Do/Don’t plus Lookup', async ({page})=>{
            await expect(page.locator('.bottom-nav .nav-button')).toHaveCount(5);
            await expect(page.locator('.bottom-nav [data-route="dosdonts"]')).toHaveCount(0);
            await expect(page.locator('.bottom-nav [data-route="lookup"]')).toHaveCount(0);
            await page.locator('#menuButton').click();
            const menuButtons=page.locator('#sideMenu > button');
            await expect(menuButtons.filter({hasText:'Official Do’s & Don’ts'})).toHaveCount(1);
            await expect(menuButtons.filter({hasText:'Admin Reference'})).toHaveCount(1);
            await expect(menuButtons.last()).toHaveText('Quick Lookup');
          });

          test('Do/Don’t content changes by mode and uses plus/minus', async ({page})=>{
            await page.locator('#menuButton').click();
            await page.locator('#sideMenu [data-route="dosdonts"]').click();
            await expect(page.locator('#mainContent')).toContainText('Report to your Early Voting location by 9:00 AM.');
            await expect(page.locator('#mainContent')).not.toContainText('Report to your Election Day polling location at 5:00 AM.');
            const toggle=page.locator('.rule-card').first().locator('.rule-plusminus');
            const before=await toggle.evaluate(el=>getComputedStyle(el,'::after').content);
            expect(before).toContain('+');
            await page.locator('.rule-card').first().locator('[data-rule-toggle]').click();
            const after=await toggle.evaluate(el=>getComputedStyle(el,'::after').content);
            expect(after).toContain('−');
            await page.locator('.mode-button[data-mode="election"]').click();
            await expect(page.locator('#mainContent')).toContainText('Report to your Election Day polling location at 5:00 AM.');
            await expect(page.locator('#mainContent')).toContainText('Do not be late.');
            await expect(page.locator('#mainContent')).not.toContainText('Report to your Early Voting location by 9:00 AM.');
          });

          test('Election Day manual reminder has balanced stars', async ({page})=>{
            await page.locator('.mode-button[data-mode="election"]').click();
            await page.locator('.bottom-nav [data-route="guide"]').click();
            const heading=page.locator('.election-manual-heading').first();
            await expect(heading).toBeVisible();
            await expect(heading.locator('> span')).toHaveCount(3);
            await expect(heading.locator('> span').first()).toHaveText('★');
            await expect(heading.locator('> span').nth(1)).toHaveText('KEEP THE MANUALS AT THE TABLE');
            await expect(heading.locator('> span').last()).toHaveText('★');
          });

          test('Election Day opening field procedure no longer cross-links to Early Voting binder copy', async ({page})=>{
            await page.locator('.mode-button[data-mode="election"]').click();
            await page.locator('.bottom-nav [data-route="procedures"]').click();
            await page.getByRole('button',{name:/Opening \/ Closing/}).click();
            await expect(page.locator('#mainContent')).toContainText('Election Day Opening');
            await expect(page.locator('#mainContent')).toContainText('Report at 5:00 AM');
            await expect(page.locator('#mainContent')).not.toContainText('Use the current machine binder');
            await expect(page.locator('#mainContent')).not.toContainText('Match each binder');
          });

          test('equipment routing uses confirmed Board and Machine Warehouse numbers', async ({page})=>{
            await page.locator('.bottom-nav [data-route="procedures"]').click();
            await page.getByRole('button',{name:/Equipment \/ Troubleshooting/}).click();
            const routing=page.locator('#field-who-to-call-routing');
            await expect(routing).toContainText('Machine Warehouse: (973) 285-6741');
            await expect(routing).toContainText('Board of Elections main number: (973) 285-6715');
            await expect(routing).toContainText('rather than choosing an individual staff member');
          });

          test('Election Day machine-key language is definite', async ({page})=>{
            await page.locator('.mode-button[data-mode="election"]').click();
            await page.locator('.bottom-nav [data-route="guide"]').click();
            const lesson=page.locator('[data-lesson-card="opening:identify-machines"]');
            await lesson.locator('[data-open-lesson="opening:identify-machines"]').click();
            await expect(lesson).toContainText('The machine keys will be in separate small manila Key Envelopes');
            await expect(lesson).not.toContainText('may be in separate small manila Key Envelopes');
          });
          EOF
          npx playwright test tests/site-review.spec.js --reporter=line
